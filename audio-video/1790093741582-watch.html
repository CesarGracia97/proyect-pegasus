ー\\nほら、照り返す海　　　　　　　　　　　　　ー熱い波ー\\n真(ホント)の君がさざめく　　　　　　　　　　ー心にー\\n\\n夢、叶えるために\\n君と私、ココに生まれたの\\nそう、輝く風をまとう　光の強さで\\nつかもう！\\n\\nぱるすぃとの共同作業でありんす(凛風)\x22,\x22styleRuns\x22:\x5b\x7b\x22startIndex\x22:0,\x22length\x22:688,\x22styleRunExtensions\x22:\x7b\x22styleRunColorMapExtension\x22:\x7b\x22colorMap\x22:\x5b\x7b\x22key\x22:\x22USER_INTERFACE_THEME_DARK\x22,\x22value\x22:4294967295\x7d,\x7b\x22key\x22:\x22USER_INTERFACE_THEME_LIGHT\x22,\x22value\x22:4279440147\x7d\x5d\x7d\x7d,\x22fontFamilyName\x22:\x22Roboto\x22\x7d\x5d\x7d,\x22headerRuns\x22:\x5b\x7b\x22startIndex\x22:0,\x22length\x22:688,\x22headerMapping\x22:\x22ATTRIBUTED_STRING_HEADER_MAPPING_UNSPECIFIED\x22\x7d\x5d,\x22backgroundColorStyle\x22:\x22BACKGROUND_COLOR_STYLE_COLOR_SAMPLED_ADDITIVE\x22,\x22lightThemeColorPalette\x22:\x7b\x22baseBackground\x22:4294963440,\x22raisedBackground\x22:4294963440,\x22additiveBackground\x22:566838597,\x22textPrimary\x22:4281992710,\x22textSecondary\x22:4287045921,\x22invertedBackground\x22:4287568153,\x22overlayBackground\x22:3426354694\x7d,\x22darkThemeColorPalette\x22:\x7b\x22baseBackground\x22:4280090881,\x22raisedBackground\x22:4281992710,\x22additiveBackground\x22:734610757,\x22textPrimary\x22:4294762206,\x22textSecondary\x22:4293631389,\x22invertedBackground\x22:4293098620,\x22overlayBackground\x22:3426354694\x7d,\x22colorSampledDescriptionBodyText\x22:\x7b\x22content\x22:\x22ガンスリンガーストラトス2\\u0026ガンスリンガーストラトス3 ＢＧＭ　日本橋\\n本当の音質はサントラCD買ってからお楽しみくださいませ♪\\nやはり日本橋bgmはすきですわ…\\n\\n歌詞：\\n誰よりそばで　　　　　　　　　　　　　ーめざせ　いまー\\n君と夢を分かちあえたなら　　　　　　　ー同じ場所ー\\nそう、青空よりも澄んだ　　　　　　　　ー夢の果てー\\n未来(あす)をつかめる　　　　　　　　　ーふたりでー\\n\\nビルの窓にさす光　乱反射してる\\nエール投げて降り注ぐ\\n\\n君の芯の強さなら　私が知ってる\\n自分らしさ　信じて\\n\\n夢を映す瞳のレンズ\\n想い焦がす　ひとすじの決意は\\nどんな障壁(かべ)もほら吹き飛ばす\\n可能性を目覚めさせてゆく\\n\\n憧れ目指す　君はSoldier\\nイタミはじき返せ！\\nそう、輝く風をまとう　光の強さで\\n\\n迷う胸の隙間へと　勇気を注ごう\\n手と手つなぐ温もりで\\n\\n体当たりの情熱は　誰もが持つ武器\\n狙い　定め撃ちぬけ！\\n\\n心かさね　広がる世界\\n破れかぶれ　メチャクチャな日だって\\n響きあえた　鼓動のリズムは\\n小さな成功　刻みつける\\n\\nタイセツな君のこと守りたいから\\n強くも弱くもなる心　抱きしめ\\nあぁ　どこまでもゆくよ\\n\\nいま、誰よりそばで
