<div class="converter-card">
  <!-- Cabecera Superior Ancho Completo -->
  <div class="card-header">
    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
    <h2 class="header-title">Convertidor de Documentos</h2>
  </div>

  <div class="form-body">
    <!-- Paso 1: Carga de Archivo -->
    <div class="form-group">
      <label class="step-label">1. Selecciona o arrastra el documento:</label>
      
      <div
        class="input-file-bar"
        [class.has-file]="selectedFile()"
        [class.drag-over]="isDragOver()"
        [class.disabled]="isConverting() || isLoadingTargets()"
        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <input
          #fileInput
          type="file"
          [disabled]="isConverting() || isLoadingTargets()"
          (change)="onFileSelected($event)"
          class="hidden-input"
        />

        <div class="input-content">
          @if (selectedFile()) {
            <span class="file-name">📄 {{ selectedFile()?.name }}</span>
            <button type="button" class="btn-remove" (click)="$event.stopPropagation(); resetState()" title="Quitar archivo">
              ✕
            </button>
          } @else {
            <span class="placeholder-text">Haz clic o arrastra tu archivo aquí (.docx, .pdf, .txt...)</span>
          }
        </div>
      </div>
    </div>

    <!-- Paso 2: Selección de Formato -->
    <div class="form-group">
      <label class="step-label">2. Selecciona el formato de salida:</label>
      
      <div class="select-wrapper">
        <select
          id="formatSelect"
          class="custom-select"
          [ngModel]="selectedTarget()"
          (ngModelChange)="selectedTarget.set($event)"
          [disabled]="!selectedFile() || isConverting() || isLoadingTargets()"
        >
          @if (!selectedFile()) {
            <option value="" disabled selected>--- Primero selecciona un documento ---</option>
          } @else if (isLoadingTargets()) {
            <option value="" disabled selected>Cargando formatos disponibles...</option>
          } @else {
            <option value="" disabled selected>--- Selecciona un formato ---</option>
            @for (target of allowedTargets(); track target) {
              <option [value]="target">{{ target.toUpperCase() }}</option>
            }
          }
        </select>
      </div>
    </div>

    <!-- Mensajes de Estado -->
    @if (errorMessage()) {
      <div class="alert alert-error">⚠️ {{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert-success">✅ {{ successMessage() }}</div>
    }

    <!-- Botón Principal -->
    <button
      type="button"
      class="btn-action"
      [disabled]="!selectedFile() || !selectedTarget() || isConverting() || isLoadingTargets()"
      (click)="executeConversion()"
    >
      @if (isConverting()) {
        <span class="spinner"></span>
        <span>Procesando y convirtiendo...</span>
      } @else {
        <span>Convertir Documento</span>
      }
    </button>
  </div>
</div>
