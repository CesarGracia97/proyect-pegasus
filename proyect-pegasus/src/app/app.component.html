<!-- Telón Global Z-Slash (Estilo Mega Man Zero) -->
<div class="curtain-overlay" [class.active]="isNavigating()">
  <div class="z-block z-top"></div>
  <div class="z-block z-bottom"></div>
</div>

@if (showIntro()) {
  <app-splash (animationFinished)="onIntroEnded()" />
} @else {
  <router-outlet />
}
