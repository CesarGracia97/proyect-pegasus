worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Rate Limiting por IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

    server {
        listen 8085;
        server_name localhost;

        # ---------------------------------------------------------------------
        # 1. FRONTEND (Angular - Contenedor en puerto 2080)
        # ---------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:2080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # 2. MEDIA: AUDIO, VIDEO, YOUTUBE E IMÁGENES (NestJS - Puerto 3000)
        # ---------------------------------------------------------------------
        location /api/v1/media/ {
            limit_req zone=general_limit burst=5 nodelay;

            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 500M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------------------------------------------------------------------
        # 3. CONVERTIDOR DE DOCUMENTOS (FastAPI - Puerto 8000)
        # ---------------------------------------------------------------------
        location /documents/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------------------------------------------------------------------
        # 4. CONVERTIDOR DE DATOS (FastAPI - Puerto 8000) 
        # ---------------------------------------------------------------------
        location /data/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}